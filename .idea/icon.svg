<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#113e77" />
      <stop offset="100%" stop-color="#2bc7ea" />
    </linearGradient>
    
    <!-- Outer App Icon Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    
    <!-- Inner Figure Drop Shadow -->
    <filter id="innerShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Rounded App Icon Base -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="#ffffff" stroke-width="16" filter="url(#dropShadow)" />

  <!-- Community / Connection Graphic -->
  <g transform="translate(256, 256)" filter="url(#innerShadow)">

    <!-- Top Right Figure (Yellow) -->
    <path d="M 0 -90 A 90 90 0 0 1 78 45" fill="none" stroke="#ffc928" stroke-width="36" stroke-linecap="round"/>
    <circle cx="52" cy="-30" r="28" fill="#ffc928" />

    <!-- Bottom Figure (Orange) -->
    <path d="M 78 45 A 90 90 0 0 1 -78 45" fill="none" stroke="#ff7637" stroke-width="36" stroke-linecap="round"/>
    <circle cx="0" cy="60" r="28" fill="#ff7637" />

    <!-- Top Left Figure (Cyan) -->
    <path d="M -78 45 A 90 90 0 0 1 0 -90" fill="none" stroke="#20d2c3" stroke-width="36" stroke-linecap="round"/>
    <circle cx="-52" cy="-30" r="28" fill="#20d2c3" />

  </g>
</svg>
